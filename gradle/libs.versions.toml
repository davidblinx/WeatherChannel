[versions]
# Android X
androidx-core-ktx = "1.19.0"
androidx-annotation-experimental = "1.5.1"
androidx-lifecycle = "2.11.0"
androidx-junit = "1.3.0"
androidx-tracing = "1.3.0"

# Jetbrains
kotlin = "2.4.10"
kotlin-immutable-collections = "0.5.1"
kotlin-serialization = "1.11.0"
kotlin-coroutines = "1.11.0"

# KSP
ksp = "2.3.11"

# Dagger/Hilt
dagger = "2.60.1"

# Compose
compose = "1.11.4"
compose-activity = "1.13.0"
compose-material3 = "1.4.0"
compose-material3-adaptive-navigation-suite = "1.4.0"
compose-graphics-core = "1.0.4"
compose-graphics = "1.1.0"

# Coil
coil = "3.5.0"

# Ktor
ktor = "3.5.2"

# Gradle
gradlePlugins-agp = "9.3.1"
gradlePlugins-androidTools = "32.3.1"
gradlePlugins-androidxLint = "1.0.0"

# Unit tests
junit = "4.13.2"

# Android test
espresso-core = "3.7.0"

# Versioning
app-version-appId = "com.david.weatherchannel"
app-version-versionCode = "1"
app-version-versionName = "1.0"

# Build
app-build-compileSDKVersion = "37"
app-build-minimumSDK = "28"
app-build-javaVersion = "VERSION_21"
app-build-testRunner = "androidx.test.runner.AndroidJUnitRunner"
app-build-kotlinJVMTarget = "21"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-lint-gradle = { group = "androidx.lint", name = "lint-gradle", version.ref = "gradlePlugins-androidxLint" }
androidx-annotation-experimental = { group = "androidx.annotation", name = "annotation-experimental", version.ref = "androidx-annotation-experimental" }

# Unit tests
unit-test-junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-tracing = { group = "androidx.tracing", name = "tracing-ktx", version.ref = "androidx-tracing" }

# Android tests
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }

# AndroidX lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
unit-test-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }

# JetBrains
kotlin-immutable-collections = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlin-immutable-collections" }
kotlin-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlin-metadata = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# Compose
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "compose-material3-adaptive-navigation-suite" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "compose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }

# Compose UI
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-geometry = { group = "androidx.compose.ui", name = "ui-geometry", version.ref = "compose" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling-debug = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }
compose-ui-test-junit = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }

# Compose Animations
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "compose" }
compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics", version.ref = "compose" }

# Compose Graphics
compose-graphics-core = { group = "androidx.graphics", name = "graphics-core", version.ref = "compose-graphics-core" }
compose-graphics-path = { group = "androidx.graphics", name = "graphics-path", version.ref = "compose-graphics" }
compose-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "compose-graphics" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Ktor
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Dagger/Hilt
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "dagger" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "dagger" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "dagger" }

# Build configuration dependencies
gradlePlugin-android = { group = "com.android.tools.build", name = "gradle", version.ref = "gradlePlugins-agp" }
gradlePlugin-android-tools-common = { group = "com.android.tools", name = "common", version.ref = "gradlePlugins-androidTools" }
gradlePlugin-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-compose-compiler = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-ksp = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }

[bundles]
compose = [
    "compose-activity",
    "compose-material3",
    "compose-material3-adaptive-navigation-suite",
    "compose-foundation",
    "compose-foundation-layout",
    "compose-runtime",
    "compose-ui",
    "compose-ui-util",
    "compose-ui-graphics",
    "compose-ui-geometry",
    "compose-ui-text",
    "compose-ui-tooling-preview",
]

compose-animations = [
    "compose-animation",
    "compose-animation-core",
    "compose-animation-graphics",
]

compose-graphics = [
    "compose-graphics-core",
    "compose-graphics-shapes",
]

compose-debug = [
    "compose-ui-tooling-debug",
    "compose-ui-test-manifest"
]

compose-test = [
    "compose-ui-test-junit",
]

coroutines = [
    "coroutines-android",
    "coroutines-core",
]

coil = [
    "coil-compose",
    "coil-network-okhttp",
]

ktor = [
    "ktor-core",
    "ktor-okhttp",
    "ktor-content-negotiation",
    "ktor-serialization-json",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
android-library = { id = "com.android.library", version.ref = "gradlePlugins-agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
android-lint = { id = "com.android.lint", version.ref = "gradlePlugins-agp" }

# Convention plugins
convention-app = { id = "convention.android.app" }
convention-library = { id = "convention.android.library" }
convention-compose-app = { id = "convention.android.compose.app" }
convention-compose-library = { id = "convention.android.compose.library" }
convention-hilt = { id = "convention.android.hilt" }
convention-kotlin-serialization = { id = "convention.android.kotlin.serialization" }
